# Colors (hellwal)
# Consider this file as your bible: /usr/share/doc/kitty/html/_downloads/433dadebd0bf504f8b008985378086ce/kitty.conf
include ~/.cache/hellwal/colors-kitty.conf

# Font
font_family      Adwaita Mono
font_size        10.5
## Fix Kitty's ugly font rendering
text_composition_strategy legacy

# Padding
window_padding_width 8

# Cursor
cursor_shape              beam
cursor_beam_thickness     1
cursor_shape_unfocused    unchanged
cursor_blink_interval     0

# Keybinds
map alt+z toggle_layout stack
map ctrl+h neighboring_window left
map ctrl+j neighboring_window bottom
map ctrl+k neighboring_window top
map ctrl+l neighboring_window right
map ctrl+, launch --location=hsplit --cwd=current
map ctrl+. launch --location=vsplit --cwd=current
map kitty_mod+enter new_window_with_cwd
map ctrl+0 change_font_size all 0
map ctrl+shift+q close_window
map f10 save_as_session --use-foreground-process --base-dir ~/.local/share/kitty/sessions
map f9 goto_session ~/.config/kitty/sessions/



# Borders/splits
enabled_layouts splits
inactive_tab_font_style normal
active_tab_font_style bold-italic
window_border_width 1
inactive_text_alpha 0.7

# Tabs
tab_bar_edge top
tab_bar_align right
tab_bar_style fade
tab_fade 1
tab_bar_margin_height 4.0 0.4
tab_title_template "  {title.split('/')[-1]} "
active_tab_title_template " ✓ {title.split('/')[-1]} "
