# Theme
source-file ~/.config/tmux/style.conf

# Settings
set -g base-index 1
set -g pane-base-index 1
set -g mouse on
set -g default-command /bin/bash
set -g mode-keys vi
set -g status-keys vi

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g focus-events on

# Performance and history
set -s escape-time 0          # Remove Escape key delay
set -g history-limit 50000    # Keep 50,000 lines of scrollback
set -g display-time 4000      # Show tmux messages for 4 seconds
set -g status-interval 5      # Refresh status bar every 5 seconds
setw -g aggressive-resize on  # Resize windows based on active clients

# Prefix: Ctrl+A instead of Ctrl+B
unbind C-b
set -g prefix C-a
bind -N "Send prefix" C-a send-prefix

# Configuration
bind -N "Reload configuration" r source-file ~/.config/tmux/tmux.conf

# Windows
bind -N "New window" c new-window -c "#{pane_current_path}"
bind -N "Previous window" C-p previous-window
bind -N "Next window" C-n next-window
bind -N "Last window" a last-window

# Pane splitting
unbind '"'
unbind %

# Pane zoom (Alt+Z)
bind -n -N "Toggle pane zoom" M-z resize-pane -Z

bind -N "Split horizontally" h split-window -h -c "#{pane_current_path}"
bind -N "Split vertically" v split-window -v -c "#{pane_current_path}"

# Pane navigation
# Handled by vim-tmux-navigator (Ctrl+HJKL)

# Pane swapping (Alt+HJKL)
bind -n -N "Swap previous pane" M-h swap-pane -d -U
bind -n -N "Swap next pane" M-j swap-pane -d -D
bind -n -N "Swap previous pane" M-k swap-pane -d -U
bind -n -N "Swap next pane" M-l swap-pane -d -D

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.local/share/tmux/plugins/tpm/tpm'

