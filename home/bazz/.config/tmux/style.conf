# Status
set -g status on
set -g status-bg black
set -g status-justify right
set -g status-left-length 100
set -g status-right-length 100
set -g status-position top
set -g status-interval 5

# Mode indicator
set -g @mode_normal '#[fg=cyan,bg=black] ● #[default]'
set -g @mode_prefix '#[fg=cyan,bg=red] ◆ #[default]'
set -g @mode_copy '#[fg=red,bg=black] 󰆐 #[default]'
set -g @mode_sync '#[fg=red,bg=black] ⇄ #[default]'

set -g status-left '#{?client_prefix,#{E:@mode_prefix},#{?pane_in_mode,#{E:@mode_copy},#{?window_synchronize_panes,#{E:@mode_sync},#{E:@mode_normal}}}}'

# Messages
set -g message-style "fg=white,bg=black,align=centre"
set -g message-command-style "fg=white,bg=brightblack,align=centre"

# Panes
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=magenta"

# Windows
setw -g window-status-activity-style "fg=white,bg=black,none"
setw -g window-status-separator ""
setw -g window-status-style "fg=white,bg=black,none"

# Window formatting
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "fg=black,bg=cyan,nounderscore,none"
setw -g window-status-current-format "#[bg=cyan,fg=black,nounderscore] (✓) #W "

# Statusline
set -g status-right ""

# Left: mode indicator
# Center: date and clock
# Right: window list
set -g status-format[0] '#[align=left]#{E:status-left}#[align=centre]#[fg=white,bg=black]%H:%M#[align=right]#{W:#{E:window-status-format},#{E:window-status-current-format}}'

# Modes
setw -g clock-mode-colour blue
setw -g mode-style "fg=yellow,bg=white,bold"
