; Project QML formatting for qmlformat (Qt 6).
; Keeps the shell's existing style instead of inheriting tighter editor settings.
[General]
IndentWidth=4
MaxColumnWidth=-1
UseTabs=false
NewlineType=unix
SemicolonRule=always
NormalizeOrder=false
SortImports=false
GroupAttributesTogether=false
ObjectsSpacing=false
FunctionsSpacing=false
SingleLineEmptyObjects=false
